services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite drift log between container restarts
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s